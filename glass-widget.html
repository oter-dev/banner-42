<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Yandex Music — Ambient Glass Widget</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            background: transparent;
            color: #fff;
            overflow: hidden;
            padding: 32px;
        }

        .widget-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 20px;
            width: 536px;
            height: 148px;
            padding: 20px 26px 20px 20px;
            border-radius: 24px;
            background: rgba(16, 16, 20, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow:
                0 20px 48px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            overflow: hidden;
            opacity: 0;
            transform: translateY(24px) scale(0.97);
            transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .widget-container.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Динамический размытый фон из обложки */
        .ambient-bg {
            position: absolute;
            inset: -35px;
            z-index: 0;
            overflow: hidden;
        }

        .ambient-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(36px) saturate(1.85) brightness(0.62);
            transform: scale(1.25);
            opacity: 0;
            transition: opacity 0.65s ease;
        }

        .ambient-bg img.loaded {
            opacity: 0.9;
        }

        .ambient-scrim {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: linear-gradient(
                90deg,
                rgba(10, 10, 14, 0.42) 0%,
                rgba(10, 10, 14, 0.62) 60%,
                rgba(10, 10, 14, 0.72) 100%
            );
        }

        /* Крупная обложка */
        .cover-wrapper {
            position: relative;
            z-index: 2;
            width: 106px;
            height: 106px;
            border-radius: 16px;
            overflow: hidden;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
        }

        .cover-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.5s ease;
        }

        .cover-wrapper img.loaded {
            opacity: 1;
        }

        .paused .cover-wrapper img.loaded {
            transform: scale(0.96);
            filter: brightness(0.75);
        }

        /* Информация о треке */
        .track-info {
            position: relative;
            z-index: 2;
            flex: 1;
            min-width: 0;
        }

        .service-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.78);
        }

        .service-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1ed760;
            box-shadow: 0 0 10px #1ed760;
            animation: livePulse 1.6s infinite ease-in-out;
        }

        .paused .service-dot {
            background: #ffcc00;
            box-shadow: none;
            animation: none;
        }

        @keyframes livePulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.72); opacity: 0.5; }
        }

        .track-title {
            font-size: 21px;
            font-weight: 750;
            line-height: 1.22;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
        }

        .track-artist {
            font-size: 15px;
            font-weight: 500;
            line-height: 1.25;
            color: rgba(255, 255, 255, 0.76);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
        }

        /* Спектр */
        .equalizer {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 30px;
            flex-shrink: 0;
        }

        .equalizer span {
            width: 4px;
            height: 5px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.35);
            animation: spectrum 1.05s infinite ease-in-out;
            transition: height 0.25s ease, opacity 0.25s ease;
        }

        .equalizer span:nth-child(1) { animation-delay: -0.9s; }
        .equalizer span:nth-child(2) { animation-delay: -0.3s; }
        .equalizer span:nth-child(3) { animation-delay: -0.7s; }
        .equalizer span:nth-child(4) { animation-delay: -0.15s; }
        .equalizer span:nth-child(5) { animation-delay: -0.55s; }
        .equalizer span:nth-child(6) { animation-delay: -0.8s; }

        @keyframes spectrum {
            0%, 100% { height: 5px; }
            50% { height: 28px; }
        }

        .paused .equalizer span {
            animation: none;
            height: 5px;
            opacity: 0.35;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div id="widget" class="widget-container">
        <div class="ambient-bg">
            <img id="bgCover" alt="">
        </div>
        <div class="ambient-scrim"></div>

        <div class="cover-wrapper">
            <img id="cover" alt="">
        </div>

        <div class="track-info">
            <div class="service-badge">
                <span class="service-dot"></span>
                <span id="statusText">ЯНДЕКС МУЗЫКА</span>
            </div>
            <div id="title" class="track-title">Ожидание музыки...</div>
            <div id="artist" class="track-artist">—</div>
        </div>

        <div class="equalizer">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <script>
        const WS_URL = 'wss://yandex-bridge.kirillselivonchik0.workers.dev/';

        const widget = document.getElementById('widget');
        const titleEl = document.getElementById('title');
        const artistEl = document.getElementById('artist');
        const coverEl = document.getElementById('cover');
        const bgCoverEl = document.getElementById('bgCover');
        const statusText = document.getElementById('statusText');

        let ws = null;
        let reconnectTimer = null;
        let currentCover = '';

        [coverEl, bgCoverEl].forEach((img) => {
            img.addEventListener('load', () => img.classList.add('loaded'));
            img.addEventListener('error', () => {
                img.classList.remove('loaded');
                img.removeAttribute('src');
            });
        });

        function scheduleReconnect() {
            if (reconnectTimer) return;
            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                connectWebSocket();
            }, 3000);
        }

        function connectWebSocket() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

            try {
                ws = new WebSocket(WS_URL);
            } catch (_) {
                scheduleReconnect();
                return;
            }

            ws.onopen = () => {
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data && typeof data === 'object') updateWidget(data);
                } catch (e) {
                    console.error('Invalid JSON:', e);
                }
            };

            ws.onerror = () => {
                try { ws.close(); } catch (_) {}
            };

            ws.onclose = () => {
                ws = null;
                scheduleReconnect();
            };
        }

        function updateWidget(data) {
            const title = typeof data.title === 'string' ? data.title.trim() : '';
            if (!title) {
                widget.classList.remove('visible');
                return;
            }

            titleEl.textContent = title;
            artistEl.textContent = (typeof data.artist === 'string' && data.artist.trim()) ? data.artist.trim() : '—';

            const nextCover = typeof data.cover === 'string' ? data.cover.trim() : '';
            if (nextCover !== currentCover) {
                currentCover = nextCover;
                [coverEl, bgCoverEl].forEach((img) => {
                    img.classList.remove('loaded');
                    if (nextCover) {
                        img.src = nextCover;
                    } else {
                        img.removeAttribute('src');
                    }
                });
            }

            const playing = Boolean(data.isPlaying);
            statusText.textContent = playing ? 'ЯНДЕКС МУЗЫКА' : 'НА ПАУЗЕ';
            widget.classList.add('visible');
            widget.classList.toggle('paused', !playing);
        }

        connectWebSocket();
    </script>
</body>
</html>
