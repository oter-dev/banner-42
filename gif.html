<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Twilight Rooftop Background - denmiten36</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #060918;
  }

  .scene {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: linear-gradient(180deg, #0b1636 0%, #1d2f6b 38%, #342159 72%, #110b22 100%);
  }

  svg.world {
    position: absolute;
    inset: -30px;
    width: calc(100% + 60px);
    height: calc(100% + 60px);
    display: block;
  }

  canvas#fx {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 3;
  }

  /* Виньетка и мягкое затемнение слева под чат */
  .overlay-shade {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    background:
      linear-gradient(90deg, rgba(4, 6, 16, 0.72) 0%, rgba(4, 6, 16, 0.34) 24%, rgba(4, 6, 16, 0) 44%),
      radial-gradient(ellipse at 60% 48%, transparent 52%, rgba(3, 4, 14, 0.62) 100%);
  }

  /* ================= 2.5D ПАРАЛЛАКС И ДВИЖЕНИЯ СЦЕНЫ ================= */

  .cam-sky {
    animation: camSlow 14s ease-in-out infinite alternate;
  }
  .cam-city {
    animation: camMid 14s ease-in-out infinite alternate;
  }
  .cam-foreground {
    animation: camFront 14s ease-in-out infinite alternate;
  }

  @keyframes camSlow {
    0% { transform: translate(0px, 0px); }
    100% { transform: translate(-12px, -6px); }
  }
  @keyframes camMid {
    0% { transform: translate(0px, 0px); }
    100% { transform: translate(-24px, -10px); }
  }
  @keyframes camFront {
    0% { transform: translate(0px, 0px); }
    100% { transform: translate(-38px, -14px); }
  }

  /* Облака */
  .cloud-drift-1 { animation: cloudMove1 48s linear infinite; }
  .cloud-drift-2 { animation: cloudMove2 64s linear infinite; }

  @keyframes cloudMove1 {
    0% { transform: translateX(-300px); }
    100% { transform: translateX(2200px); }
  }
  @keyframes cloudMove2 {
    0% { transform: translateX(-500px); }
    100% { transform: translateX(2100px); }
  }

  /* Неоновый поезд метро на эстакаде */
  .train-pass {
    animation: metroGlide 16s cubic-bezier(0.3, 0.05, 0.7, 0.95) infinite;
  }
  @keyframes metroGlide {
    0% { transform: translateX(-720px); opacity: 0; }
    8% { opacity: 1; }
    52% { opacity: 1; }
    60%, 100% { transform: translateX(2400px); opacity: 0; }
  }

  /* Мигание маячков на крышах и мерцание неона */
  .beacon-blink {
    animation: beacon 2.2s ease-in-out infinite;
  }
  .beacon-blink-2 {
    animation: beacon 2.8s ease-in-out -1.1s infinite;
  }
  @keyframes beacon {
    0%, 40%, 100% { opacity: 0.25; }
    50%, 60% { opacity: 1; }
  }

  .neon-flicker {
    animation: neonHum 6.5s ease-in-out infinite;
  }
  @keyframes neonHum {
    0%, 18%, 22%, 72%, 76%, 100% { opacity: 1; }
    20% { opacity: 0.55; }
    74% { opacity: 0.72; }
  }

  .lamp-pulse {
    animation: lampGlow 4.5s ease-in-out infinite;
  }
  @keyframes lampGlow {
    0%, 100% { opacity: 0.75; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.06); }
  }

  /* Призрачный Stand за спиной */
  .stand-hover {
    animation: standFloat 5.2s ease-in-out infinite;
  }
  .stand-aura {
    animation: auraExpand 3.6s ease-in-out infinite;
  }
  .stand-eyes {
    animation: redLaser 2s ease-in-out infinite;
  }
  .chain-float-1 {
    animation: floatChain1 6s ease-in-out infinite alternate;
  }
  .chain-float-2 {
    animation: floatChain2 7.2s ease-in-out -1.5s infinite alternate;
  }

  @keyframes standFloat {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-24px) rotate(1.5deg); }
  }
  @keyframes auraExpand {
    0%, 100% { transform: scale(0.96); opacity: 0.45; }
    50% { transform: scale(1.06); opacity: 0.85; }
  }
  @keyframes redLaser {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 1; filter: drop-shadow(0 0 22px #ff1a40); }
  }
  @keyframes floatChain1 {
    0% { transform: translateY(0px) rotate(-3deg); }
    100% { transform: translateY(-16px) rotate(4deg); }
  }
  @keyframes floatChain2 {
    0% { transform: translateY(-10px) rotate(4deg); }
    100% { transform: translateY(14px) rotate(-3deg); }
  }

  /* Анимации главного героя (живая анатомия + вторичная физика) */
  .hero-torso {
    animation: torsoBreathe 3.6s ease-in-out infinite;
  }
  .hero-shoulders {
    animation: shoulderRoll 3.6s ease-in-out -0.15s infinite;
  }
  .hero-head {
    animation: headTilt 4.2s ease-in-out -0.35s infinite;
  }
  .hair-wind-l {
    animation: hairWhipL 3.2s ease-in-out infinite alternate;
  }
  .hair-wind-r {
    animation: hairWhipR 3.5s ease-in-out -0.6s infinite alternate;
  }
  .hair-bangs {
    animation: hairFront 2.8s ease-in-out infinite alternate;
  }
  .arm-right-idle {
    animation: armRestBob 3.6s ease-in-out -0.25s infinite;
  }
  .arm-left-heart {
    animation: armHeartMove 3.6s ease-in-out -0.45s infinite;
  }
  .mask-hip-swing {
    animation: maskSway 3.9s ease-in-out -0.3s infinite alternate;
  }
  .mask-chains-follow {
    animation: chainsFollow 3.9s ease-in-out -0.75s infinite alternate;
  }
  .pants-wind {
    animation: clothRipple 3.8s ease-in-out infinite alternate;
  }
  .blink {
    animation: eyeBlink 5.2s ease-in-out infinite;
  }
  .glass-shine {
    animation: lensGlint 5.8s ease-in-out infinite;
  }
  .heart-rise-1 {
    animation: heartUp 2.8s ease-out infinite;
  }
  .heart-rise-2 {
    animation: heartUp 2.8s ease-out -1.4s infinite;
  }

  @keyframes torsoBreathe {
    0%, 100% { transform: translateY(0px) scaleY(1); }
    50% { transform: translateY(-10px) scaleY(1.016); }
  }
  @keyframes shoulderRoll {
    0%, 100% { transform: rotate(-0.6deg); }
    50% { transform: rotate(0.8deg); }
  }
  @keyframes headTilt {
    0%, 100% { transform: translateY(0px) rotate(-1.4deg); }
    50% { transform: translateY(-12px) rotate(1.8deg); }
  }
  @keyframes hairWhipL {
    0% { transform: rotate(-3deg) skewX(-2deg); }
    100% { transform: rotate(5deg) skewX(3deg); }
  }
  @keyframes hairWhipR {
    0% { transform: rotate(2deg) skewX(1deg); }
    100% { transform: rotate(-6deg) skewX(-3deg); }
  }
  @keyframes hairFront {
    0% { transform: rotate(-1.5deg); }
    100% { transform: rotate(2.5deg); }
  }
  @keyframes armRestBob {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-6px) rotate(-2deg); }
  }
  @keyframes armHeartMove {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-11px) rotate(3deg); }
  }
  @keyframes maskSway {
    0% { transform: rotate(-5.5deg); }
    100% { transform: rotate(4.5deg); }
  }
  @keyframes chainsFollow {
    0% { transform: rotate(-8deg); }
    100% { transform: rotate(7.5deg); }
  }
  @keyframes clothRipple {
    0% { transform: skewX(-1deg); }
    100% { transform: skewX(1.2deg); }
  }
  @keyframes eyeBlink {
    0%, 45%, 49%, 93%, 100% { transform: scaleY(1); }
    47%, 95% { transform: scaleY(0.06); }
  }
  @keyframes lensGlint {
    0%, 58% { transform: translateX(-160px); opacity: 0; }
    68% { opacity: 0.9; }
    82%, 100% { transform: translateX(190px); opacity: 0; }
  }
  @keyframes heartUp {
    0% { transform: translate(0px, 0px) scale(0.5); opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 0.9; }
    100% { transform: translate(18px, -78px) scale(1.25) rotate(12deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="scene">
  <svg class="world" viewBox="-30 -30 1980 1140" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Сумеречное небо (в тон реальных фото) -->
      <linearGradient id="twilightSky" x1="20%" y1="0%" x2="80%" y2="100%">
        <stop offset="0%" stop-color="#09112b"/>
        <stop offset="42%" stop-color="#1c3573"/>
        <stop offset="76%" stop-color="#412468"/>
        <stop offset="100%" stop-color="#170d2e"/>
      </linearGradient>

      <!-- Луна -->
      <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff69b4" stop-opacity="0.38"/>
        <stop offset="45%" stop-color="#5897ff" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      </radialGradient>

      <linearGradient id="moonDisc" x1="20%" y1="0%" x2="80%" y2="100%">
        <stop offset="0%" stop-color="#fff4fa"/>
        <stop offset="65%" stop-color="#ffd1e8"/>
        <stop offset="100%" stop-color="#ff8bc5"/>
      </linearGradient>

      <!-- Свет уличного фонаря -->
      <radialGradient id="streetGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffbb55" stop-opacity="0.82"/>
        <stop offset="35%" stop-color="#ff7a33" stop-opacity="0.32"/>
        <stop offset="100%" stop-color="#ff5522" stop-opacity="0"/>
      </radialGradient>

      <!-- Аура Stand -->
      <radialGradient id="standAuraGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff244c" stop-opacity="0.48"/>
        <stop offset="52%" stop-color="#3df5ff" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      </radialGradient>

      <!-- Кожа с двойным сумеречно-неоновым светом (тёплый фонарь + холодный лунный свет) -->
      <linearGradient id="skinHero" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffd5cc"/>
        <stop offset="52%" stop-color="#ea9a96"/>
        <stop offset="100%" stop-color="#b44f69"/>
      </linearGradient>

      <!-- Блестящая кожанка -->
      <linearGradient id="leatherHero" x1="15%" y1="0%" x2="85%" y2="100%">
        <stop offset="0%" stop-color="#32384a"/>
        <stop offset="45%" stop-color="#151721"/>
        <stop offset="100%" stop-color="#08090e"/>
      </linearGradient>

      <!-- Белые широкие штаны -->
      <linearGradient id="whiteTrousers" x1="0%" y1="0%" x2="100%" y2="85%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="55%" stop-color="#dce4f5"/>
        <stop offset="100%" stop-color="#9aa7cc"/>
      </linearGradient>

      <!-- Белая перчатка -->
      <linearGradient id="whiteGlove" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="68%" stop-color="#dde5f8"/>
        <stop offset="100%" stop-color="#aab7d6"/>
      </linearGradient>

      <!-- Бежевая кепка -->
      <linearGradient id="beigeCap" x1="15%" y1="0%" x2="85%" y2="100%">
        <stop offset="0%" stop-color="#f6ead0"/>
        <stop offset="58%" stop-color="#d4c09b"/>
        <stop offset="100%" stop-color="#967f60"/>
      </linearGradient>

      <!-- Маска на поясе -->
      <linearGradient id="hockeyMask" x1="10%" y1="0%" x2="90%" y2="100%">
        <stop offset="0%" stop-color="#322a2e"/>
        <stop offset="52%" stop-color="#191316"/>
        <stop offset="100%" stop-color="#0a0608"/>
      </linearGradient>

      <!-- Блик очков -->
      <clipPath id="glassesLensClip">
        <rect x="-56" y="-17" width="47" height="31" rx="7"/>
        <rect x="9" y="-17" width="47" height="31" rx="7"/>
      </clipPath>

      <filter id="glowSoft" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="7" result="b"/>
        <feMerge>
          <feMergeNode in="b"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <!-- ================= СЛОЙ 1: НЕБО, ЛУНА И ОБЛАКА (МЕДЛЕННЫЙ ПАРАЛЛАКС) ================= -->
    <g class="cam-sky">
      <rect x="-80" y="-80" width="2080" height="1240" fill="url(#twilightSky)"/>

      <!-- Звёзды -->
      <g fill="#ffffff" opacity="0.65">
        <circle cx="220" cy="110" r="2"/>
        <circle cx="380" cy="185" r="1.5"/>
        <circle cx="520" cy="75" r="2.2"/>
        <circle cx="690" cy="145" r="1.8"/>
        <circle cx="880" cy="95" r="2.5"/>
        <circle cx="1040" cy="210" r="1.5"/>
        <circle cx="1510" cy="130" r="2"/>
        <circle cx="1710" cy="85" r="2.3"/>
        <circle cx="1820" cy="240" r="1.7"/>
      </g>

      <!-- Огромная сумеречная луна -->
      <g transform="translate(1310, 265)">
        <circle cx="0" cy="0" r="340" fill="url(#moonHalo)"/>
        <circle cx="0" cy="0" r="138" fill="url(#moonDisc)" opacity="0.92"/>
        <circle cx="-38" cy="-28" r="24" fill="rgba(215, 110, 175, 0.25)"/>
        <circle cx="42" cy="32" r="34" fill="rgba(215, 110, 175, 0.2)"/>
        <circle cx="15" cy="-58" r="16" fill="rgba(215, 110, 175, 0.22)"/>
      </g>

      <!-- Плывущие ночные облака -->
      <g class="cloud-drift-1" opacity="0.28" fill="#6350a8">
        <path d="M0,250 Q80,200 180,225 Q260,175 370,215 Q470,190 540,250 Z"/>
      </g>
      <g class="cloud-drift-2" opacity="0.22" fill="#92488e">
        <path d="M0,340 Q120,285 250,315 Q360,260 490,310 Q610,285 700,345 Z"/>
      </g>
    </g>

    <!-- ================= СЛОЙ 2: НОЧНОЙ ГОРОД, НЕОН И ПОЕЗД МЕТРО ================= -->
    <g class="cam-city">
      <!-- Дальний горизонт небоскрёбов -->
      <g fill="#121433">
        <rect x="0" y="540" width="120" height="540"/>
        <rect x="110" y="470" width="145" height="610"/>
        <rect x="245" y="570" width="110" height="510"/>
        <rect x="345" y="420" width="160" height="660"/>
        <rect x="495" y="520" width="130" height="560"/>
        <rect x="615" y="385" width="175" height="695"/>
        <rect x="780" y="510" width="140" height="570"/>
        <rect x="1420" y="460" width="165" height="620"/>
        <rect x="1575" y="370" width="190" height="710"/>
        <rect x="1755" y="490" width="195" height="590"/>
      </g>

      <!-- Красные маячки на крышах -->
      <circle class="beacon-blink" cx="425" cy="415" r="6" fill="#ff2e55" filter="url(#glowSoft)"/>
      <circle class="beacon-blink-2" cx="702" cy="380" r="7" fill="#ff2e55" filter="url(#glowSoft)"/>
      <circle class="beacon-blink" cx="1670" cy="365" r="7" fill="#ff2e55" filter="url(#glowSoft)"/>

      <!-- Светящиеся окна зданий -->
      <g fill="#ffd166" opacity="0.35">
        <rect x="140" y="510" width="14" height="22"/><rect x="170" y="510" width="14" height="22"/>
        <rect x="140" y="550" width="14" height="22"/><rect x="200" y="550" width="14" height="22"/>
        <rect x="380" y="460" width="16" height="24"/><rect x="415" y="460" width="16" height="24"/>
        <rect x="450" y="505" width="16" height="24"/><rect x="380" y="550" width="16" height="24"/>
        <rect x="650" y="430" width="18" height="26"/><rect x="690" y="430" width="18" height="26"/>
        <rect x="730" y="480" width="18" height="26"/><rect x="650" y="525" width="18" height="26"/>
        <rect x="1610" y="420" width="18" height="26"/><rect x="1655" y="420" width="18" height="26"/>
        <rect x="1700" y="470" width="18" height="26"/><rect x="1610" y="515" width="18" height="26"/>
      </g>

      <!-- Неоновые вывески на зданиях (в цветах логотипа!) -->
      <g class="neon-flicker" filter="url(#glowSoft)">
        <!-- Вывеска "42" слева -->
        <rect x="520" y="545" width="84" height="58" rx="8" fill="#170a24" stroke="#ff4da6" stroke-width="4"/>
        <text x="562" y="587" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="900" font-size="34" fill="#ff69b8">42</text>

        <!-- Вертикальная лаймовая вывеска справа -->
        <rect x="1605" y="555" width="46" height="145" rx="8" fill="#091c18" stroke="#a3f048" stroke-width="3.5"/>
        <text x="1628" y="600" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="900" font-size="22" fill="#b7f36b">N</text>
        <text x="1628" y="630" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="900" font-size="22" fill="#b7f36b">E</text>
        <text x="1628" y="660" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="900" font-size="22" fill="#b7f36b">W</text>
        <text x="1628" y="690" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="900" font-size="22" fill="#b7f36b">S</text>
      </g>

      <!-- Эстакада и проезжающий поезд метро -->
      <rect x="-80" y="725" width="2080" height="26" fill="#0c0e24"/>
      <rect x="-80" y="748" width="2080" height="4" fill="#3df5ff" opacity="0.32"/>
      <g class="train-pass">
        <rect x="0" y="688" width="640" height="38" rx="8" fill="#182147" stroke="#4fe3ff" stroke-width="2.5"/>
        <g fill="#b8f7ff" filter="url(#glowSoft)">
          <rect x="24" y="698" width="48" height="16" rx="3"/>
          <rect x="86" y="698" width="48" height="16" rx="3"/>
          <rect x="148" y="698" width="48" height="16" rx="3"/>
          <rect x="225" y="698" width="48" height="16" rx="3"/>
          <rect x="287" y="698" width="48" height="16" rx="3"/>
          <rect x="349" y="698" width="48" height="16" rx="3"/>
          <rect x="426" y="698" width="48" height="16" rx="3"/>
          <rect x="488" y="698" width="48" height="16" rx="3"/>
          <rect x="550" y="698" width="48" height="16" rx="3"/>
        </g>
        <!-- Фара поезда -->
        <circle cx="634" cy="712" r="6" fill="#ffffff" filter="url(#glowSoft)"/>
      </g>

      <!-- Силуэт деревьев и фонарь слева (привет из вечернего парка на фото) -->
      <path d="M-60,820 Q90,670 210,745 Q310,660 440,765 Q530,715 620,835 L-60,880 Z" fill="#080c1c"/>
      <g transform="translate(560, 620)">
        <rect x="-6" y="0" width="12" height="320" fill="#090c1c"/>
        <circle class="lamp-pulse" cx="0" cy="0" r="95" fill="url(#streetGlow)"/>
        <circle cx="0" cy="0" r="14" fill="#ffe6a3"/>
      </g>

      <!-- Пол крыши и металлические перила -->
      <rect x="-80" y="830" width="2080" height="320" fill="#090a18"/>
      <line x1="-80" y1="830" x2="2000" y2="830" stroke="#2f3566" stroke-width="6"/>
      <line x1="-80" y1="880" x2="2000" y2="880" stroke="#22264d" stroke-width="4"/>
      <g stroke="#1b1f40" stroke-width="6">
        <line x1="120" y1="830" x2="120" y2="960"/>
        <line x1="340" y1="830" x2="340" y2="960"/>
        <line x1="560" y1="830" x2="560" y2="960"/>
        <line x1="780" y1="830" x2="780" y2="960"/>
        <line x1="1460" y1="830" x2="1460" y2="960"/>
        <line x1="1680" y1="830" x2="1680" y2="960"/>
        <line x1="1880" y1="830" x2="1880" y2="960"/>
      </g>
    </g>

    <!-- ================= СЛОЙ 3: ПРИЗРАЧНЫЙ STAND В МАСКЕ + ПАРЯЩИЕ ЦЕПИ ================= -->
    <g class="cam-mid">
      <g transform="translate(1415, 500)">
        <ellipse class="stand-aura" cx="0" cy="-30" rx="280" ry="340" fill="url(#standAuraGrad)"/>

        <!-- Парящие призрачные цепи за спиной -->
        <g class="chain-float-1" opacity="0.65">
          <path d="M-240,-210 Q-140,-120 -180,20 Q-220,150 -130,260" fill="none" stroke="#45e3ff" stroke-width="8" stroke-dasharray="18,12" stroke-linecap="round"/>
        </g>
        <g class="chain-float-2" opacity="0.65">
          <path d="M230,-230 Q150,-90 210,50 Q260,180 140,290" fill="none" stroke="#ff3864" stroke-width="8" stroke-dasharray="18,12" stroke-linecap="round"/>
        </g>

        <g class="stand-hover" opacity="0.9">
          <!-- Тело и куртка Stand -->
          <path d="M-160,220 C-175,65 -135,-30 -60,-65 L60,-65 C135,-30 175,65 160,220 Z"
                fill="#0d1326" stroke="#45e3ff" stroke-width="4.5"/>
          <path d="M-120,215 L120,215 L155,440 L-155,440 Z" fill="#131b36" stroke="#45e3ff" stroke-width="3"/>

          <!-- Поднятые кулаки в белых перчатках (как на фото 2 и 7) -->

  <canvas id="fx" width="1920" height="1080"></canvas>
  <div class="overlay-shade"></div>

<script>
  const canvas = document.getElementById("fx");
  const ctx = canvas.getContext("2d");

  const PALETTE = [
    [255, 92, 176],   // неон-розовый
    [61, 245, 255],   // циан
    [255, 187, 85],   // тёплый фонарь
    [163, 240, 72]    // кислотно-лаймовый
  ];

  // Предрендеренные мягкие спрайты свечения для идеальных 60 FPS без нагрузки на процессор
  const glowSprites = PALETTE.map(([r, g, b]) => {
    const off = document.createElement("canvas");
    off.width = 64;
    off.height = 64;
    const octx = off.getContext("2d");
    const grad = octx.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, `rgba(255, 255, 255, 1)`);
    grad.addColorStop(0.25, `rgba(${r}, ${g}, ${b}, 0.9)`);
    grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
    octx.fillStyle = grad;
    octx.fillRect(0, 0, 64, 64);
    return off;
  });

  const items = Array.from({ length: 85 }, () => createParticle(true));

  function createParticle(init = false) {
    const layer = Math.random();
    const isForegroundBokeh = layer > 0.84;
    const sprite = glowSprites[Math.floor(Math.random() * glowSprites.length)];

    return {
      x: init ? Math.random() * 1920 : -40 - Math.random() * 140,
      y: init ? Math.random() * 1080 : 180 + Math.random() * 940,
      size: isForegroundBokeh ? 34 + Math.random() * 44 : 8 + Math.random() * 16,
      vx: isForegroundBokeh ? 1.8 + Math.random() * 1.6 : 0.65 + Math.random() * 1.1,
      vy: isForegroundBokeh ? -(0.6 + Math.random() * 0.9) : -(0.25 + Math.random() * 0.75),
      alpha: isForegroundBokeh ? 0.16 + Math.random() * 0.2 : 0.45 + Math.random() * 0.5,
      phase: Math.random() * Math.PI * 2,
      waveSpeed: 0.02 + Math.random() * 0.025,
      sprite
    };
  }

  function tick() {
    ctx.clearRect(0, 0, 1920, 1080);

    for (let i = 0; i < items.length; i++) {
      const p = items[i];
      p.phase += p.waveSpeed;
      p.x += p.vx;
      p.y += p.vy + Math.sin(p.phase) * 0.45;

      if (p.x > 1980 || p.y < -80) {
        items[i] = createParticle(false);
        continue;
      }

      ctx.globalAlpha = p.alpha * (0.75 + 0.25 * Math.sin(p.phase * 1.5));
      ctx.drawImage(p.sprite, p.x - p.size * 0.5, p.y - p.size * 0.5, p.size, p.size);
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }

  tick();
</script>
