<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Twilight Rooftop Background - denmiten36</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #060918;
  }

  .scene {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: linear-gradient(180deg, #09112b 0%, #1c3573 42%, #412468 76%, #170d2e 100%);
  }

  svg.world {
    position: absolute;
    inset: -30px;
    width: calc(100% + 60px);
    height: calc(100% + 60px);
    display: block;
  }

  canvas#fx {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 3;
  }

  .overlay-shade {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    background:
      linear-gradient(90deg, rgba(4, 6, 16, 0.72) 0%, rgba(4, 6, 16, 0.34) 24%, rgba(4, 6, 16, 0) 44%),
      radial-gradient(ellipse at 60% 48%, transparent 52%, rgba(3, 4, 14, 0.62) 100%);
  }

  /* ================= 2.5D ПАРАЛЛАКС И ДВИЖЕНИЯ СЦЕНЫ ================= */

  .cam-sky { animation: camSlow 14s ease-in-out infinite alternate; }
  .cam-city { animation: camMid 14s ease-in-out infinite alternate; }
  .cam-mid { animation: camMid 14s ease-in-out infinite alternate; }
  .cam-foreground { animation: camFront 14s ease-in-out infinite alternate; }

  @keyframes camSlow {
    0% { transform: translate(0px, 0px); }
    100% { transform: translate(-12px, -6px); }
  }
  @keyframes camMid {
    0% { transform: translate(0px, 0px); }
    100% { transform: translate(-24px, -10px); }
  }
  @keyframes camFront {
    0% { transform: translate(0px, 0px); }
    100% { transform: translate(-38px, -14px); }
  }

  .cloud-drift-1 { animation: cloudMove1 48s linear infinite; }
  .cloud-drift-2 { animation: cloudMove2 64s linear infinite; }

  @keyframes cloudMove1 {
    0% { transform: translateX(-300px); }
    100% { transform: translateX(2200px); }
  }
  @keyframes cloudMove2 {
    0% { transform: translateX(-500px); }
    100% { transform: translateX(2100px); }
  }

  .train-pass { animation: metroGlide 16s cubic-bezier(0.3, 0.05, 0.7, 0.95) infinite; }
  @keyframes metroGlide {
    0% { transform: translateX(-720px); opacity: 0; }
    8% { opacity: 1; }
    52% { opacity: 1; }
    60%, 100% { transform: translateX(2400px); opacity: 0; }
  }

  .beacon-blink { animation: beacon 2.2s ease-in-out infinite; }
  .beacon-blink-2 { animation: beacon 2.8s ease-in-out -1.1s infinite; }
  @keyframes beacon {
    0%, 40%, 100% { opacity: 0.25; }
    50%, 60% { opacity: 1; }
  }

  .neon-flicker { animation: neonHum 6.5s ease-in-out infinite; }
  @keyframes neonHum {
    0%, 18%, 22%, 72%, 76%, 100% { opacity: 1; }
    20% { opacity: 0.55; }
    74% { opacity: 0.72; }
  }

  .lamp-pulse { animation: lampGlow 4.5s ease-in-out infinite; }
  @keyframes lampGlow {
    0%, 100% { opacity: 0.75; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.06); }
  }

  /* Анимация Stand за спиной */
  .stand-hover { animation: standFloat 5.2s ease-in-out infinite; }
  .stand-aura { animation: auraExpand 3.6s ease-in-out infinite; }
  .stand-eyes { animation: redLaser 2s ease-in-out infinite; }
  .chain-float-1 { animation: floatChain1 6s ease-in-out infinite alternate; }
  .chain-float-2 { animation: floatChain2 7.2s ease-in-out -1.5s infinite alternate; }

  @keyframes standFloat {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-22px) rotate(1.2deg); }
  }
  @keyframes auraExpand {
    0%, 100% { transform: scale(0.96); opacity: 0.45; }
    50% { transform: scale(1.06); opacity: 0.85; }
  }
  @keyframes redLaser {
    0%, 100% { opacity: 0.82; }
    50% { opacity: 1; filter: drop-shadow(0 0 22px #ff1a40); }
  }
  @keyframes floatChain1 {
    0% { transform: translateY(0px) rotate(-3deg); }
    100% { transform: translateY(-16px) rotate(4deg); }
  }
  @keyframes floatChain2 {
    0% { transform: translateY(-10px) rotate(4deg); }
    100% { transform: translateY(14px) rotate(-3deg); }
  }

  /* Анимации главного героя (единый якорь от талии — без разрывов) */
  .hero-torso-breathe { animation: chestBreathe 3.6s ease-in-out infinite; }
  .hero-head-bob { animation: headTilt 4.2s ease-in-out -0.35s infinite; }
  .hair-wind-l { animation: hairWhipL 3.2s ease-in-out infinite alternate; }
  .hair-wind-r { animation: hairWhipR 3.5s ease-in-out -0.6s infinite alternate; }
  .hair-bangs { animation: hairFront 2.8s ease-in-out infinite alternate; }
  .arm-right-idle { animation: armRestBob 3.6s ease-in-out -0.25s infinite; }
  .arm-left-heart { animation: armHeartMove 3.6s ease-in-out -0.45s infinite; }
  .mask-hip-swing { animation: maskSway 3.9s ease-in-out -0.3s infinite alternate; }
  .mask-chains-follow { animation: chainsFollow 3.9s ease-in-out -0.75s infinite alternate; }
  .pants-wind { animation: clothRipple 3.8s ease-in-out infinite alternate; }
  .blink { animation: eyeBlink 5.2s ease-in-out infinite; }
  .glass-shine { animation: lensGlint 5.8s ease-in-out infinite; }
  .heart-rise-1 { animation: heartUp 2.8s ease-out infinite; }
  .heart-rise-2 { animation: heartUp 2.8s ease-out -1.4s infinite; }

  @keyframes chestBreathe {
    0%, 100% { transform: scaleY(1) scaleX(1); }
    50% { transform: scaleY(1.028) scaleX(1.012); }
  }
  @keyframes headTilt {
    0%, 100% { transform: translateY(0px) rotate(-1.4deg); }
    50% { transform: translateY(-4px) rotate(1.8deg); }
  }
  @keyframes hairWhipL {
    0% { transform: rotate(-2.5deg); }
    100% { transform: rotate(4.5deg); }
  }
  @keyframes hairWhipR {
    0% { transform: rotate(2deg); }
    100% { transform: rotate(-5deg); }
  }
  @keyframes hairFront {
    0% { transform: rotate(-1.2deg); }
    100% { transform: rotate(2.2deg); }
  }
  @keyframes armRestBob {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-2.2deg); }
  }
  @keyframes armHeartMove {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(2.8deg); }
  }
  @keyframes maskSway {
    0% { transform: rotate(-4.5deg); }
    100% { transform: rotate(4deg); }
  }
  @keyframes chainsFollow {
    0% { transform: rotate(-6.5deg); }
    100% { transform: rotate(6.5deg); }
  }
  @keyframes clothRipple {
    0% { transform: skewX(-0.8deg); }
    100% { transform: skewX(1deg); }
  }
  @keyframes eyeBlink {
    0%, 45%, 49%, 93%, 100% { transform: scaleY(1); }
    47%, 95% { transform: scaleY(0.06); }
  }
  @keyframes lensGlint {
    0%, 58% { transform: translateX(-160px); opacity: 0; }
    68% { opacity: 0.9; }
    82%, 100% { transform: translateX(190px); opacity: 0; }
  }
  @keyframes heartUp {
    0% { transform: translate(0px, 0px) scale(0.5); opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 0.9; }
    100% { transform: translate(16px, -78px) scale(1.22) rotate(10deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="scene">

  <canvas id="fx" width="1920" height="1080"></canvas>
  <div class="overlay-shade"></div>
</div>

<script>
  const canvas = document.getElementById("fx");
  const ctx = canvas.getContext("2d");

  const PALETTE = [
    [255, 92, 176],
    [61, 245, 255],
    [255, 187, 85],
    [163, 240, 72]
  ];

  const glowSprites = PALETTE.map(([r, g, b]) => {
    const off = document.createElement("canvas");
    off.width = 64;
    off.height = 64;
    const octx = off.getContext("2d");
    const grad = octx.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, "rgba(255, 255, 255, 1)");
    grad.addColorStop(0.25, `rgba(${r}, ${g}, ${b}, 0.9)`);
    grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
    octx.fillStyle = grad;
    octx.fillRect(0, 0, 64, 64);
    return off;
  });

  const items = Array.from({ length: 85 }, () => createParticle(true));

  function createParticle(init = false) {
    const layer = Math.random();
    const isForegroundBokeh = layer > 0.84;
    const sprite = glowSprites[Math.floor(Math.random() * glowSprites.length)];

    return {
      x: init ? Math.random() * 1920 : -40 - Math.random() * 140,
      y: init ? Math.random() * 1080 : 180 + Math.random() * 940,
      size: isForegroundBokeh ? 34 + Math.random() * 44 : 8 + Math.random() * 16,
      vx: isForegroundBokeh ? 1.8 + Math.random() * 1.6 : 0.65 + Math.random() * 1.1,
      vy: isForegroundBokeh ? -(0.6 + Math.random() * 0.9) : -(0.25 + Math.random() * 0.75),
      alpha: isForegroundBokeh ? 0.16 + Math.random() * 0.2 : 0.45 + Math.random() * 0.5,
      phase: Math.random() * Math.PI * 2,
      waveSpeed: 0.02 + Math.random() * 0.025,
      sprite
    };
  }

  function tick() {
    ctx.clearRect(0, 0, 1920, 1080);

    for (let i = 0; i < items.length; i++) {
      const p = items[i];
      p.phase += p.waveSpeed;
      p.x += p.vx;
      p.y += p.vy + Math.sin(p.phase) * 0.45;

      if (p.x > 1980 || p.y < -80) {
        items[i] = createParticle(false);
        continue;
      }

      ctx.globalAlpha = p.alpha * (0.75 + 0.25 * Math.sin(p.phase * 1.5));
      ctx.drawImage(p.sprite, p.x - p.size * 0.5, p.y - p.size * 0.5, p.size, p.size);
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }

  tick();
</script>
