<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background: transparent;
    overflow: hidden;
    padding: 16px;
  }

  .card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 340px;
    padding: 10px 14px 10px 10px;
    border-radius: 16px;
    background: rgba(16, 16, 18, 0.78);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow:
      0 12px 32px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.07);
    overflow: hidden;
    transition:
      opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1),
      transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .card.hidden {
    opacity: 0;
    transform: translateY(10px) scale(0.98);
    pointer-events: none;
  }

  /* Мягкое свечение от обложки на фоне */
  .ambient-bg {
    position: absolute;
    inset: -20px;
    background-size: cover;
    background-position: center;
    filter: blur(32px) saturate(1.6);
    opacity: 0.22;
    z-index: 0;
    transition: background-image 0.8s ease, opacity 0.6s ease;
    pointer-events: none;
  }

  .cover-wrap {
    position: relative;
    width: 56px;
    height: 56px;
    border-radius: 10px;
    overflow: hidden;
    flex-shrink: 0;
    z-index: 1;
    background: rgba(255, 255, 255, 0.05);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
  }

  .cover-wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    pointer-events: none;
  }

  .cover {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.35s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .cover.updating {
    opacity: 0;
    transform: scale(0.94);
  }

  .info {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
  }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .text-mask {
    flex: 1;
    min-width: 0;
    overflow: hidden;
  }

  .text-mask.fade-right {
    -webkit-mask-image: linear-gradient(90deg, #000 86%, transparent 100%);
    mask-image: linear-gradient(90deg, #000 86%, transparent 100%);
  }

  .title {
    display: inline-block;
    color: rgba(255, 255, 255, 0.96);
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.25;
    white-space: nowrap;
  }

  .title.marquee {
    animation: marquee var(--marquee-duration, 10s) linear infinite;
  }

  @keyframes marquee {
    0%, 15% { transform: translateX(0); }
    85%, 100% { transform: translateX(var(--marquee-offset, -40px)); }
  }

  /* Минималистичный эквалайзер */
  .eq {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 11px;
    flex-shrink: 0;
    opacity: 0.7;
  }

  .eq span {
    width: 2px;
    background: #ffffff;
    border-radius: 2px;
    animation: eq-bounce 1.1s ease-in-out infinite;
  }

  .eq span:nth-child(1) { height: 5px; animation-delay: 0s; }
  .eq span:nth-child(2) { height: 10px; animation-delay: 0.25s; }
  .eq span:nth-child(3) { height: 6px; animation-delay: 0.5s; }

  @keyframes eq-bounce {
    0%, 100% { transform: scaleY(0.35); }
    50% { transform: scaleY(1); }
  }

  .artist {
    color: rgba(255, 255, 255, 0.55);
    font-size: 12.5px;
    font-weight: 400;
    letter-spacing: -0.005em;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .bar-bg {
    width: 100%;
    height: 2.5px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 99px;
    margin-top: 10px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    width: 0%;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 99px;
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.35);
    transition: width 1s linear;
  }
</style>
</head>
<body>
  <div class="card hidden" id="widget">
    <div class="ambient-bg" id="ambient"></div>
    <div class="cover-wrap">
      <img class="cover" id="cover" src="" alt="">
    </div>
    <div class="info">
      <div class="top-row">
        <div class="text-mask" id="titleMask">
          <div class="title" id="title">Трек</div>
        </div>
        <div class="eq" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>
      <div class="artist" id="artist">Исполнитель</div>
      <div class="bar-bg"><div class="bar-fill" id="progress"></div></div>
    </div>
  </div>

<script>
  let lastTrack = "";

  function updateTitleOverflow() {
    const mask = document.getElementById("titleMask");
    const title = document.getElementById("title");
    title.classList.remove("marquee");
    mask.classList.remove("fade-right");

    const overflow = title.scrollWidth - mask.clientWidth;
    if (overflow > 4) {
      mask.classList.add("fade-right");
      title.style.setProperty("--marquee-offset", `-${overflow + 12}px`);
      title.style.setProperty("--marquee-duration", `${Math.max(7, overflow * 0.08 + 4)}s`);
      void title.offsetWidth;
      title.classList.add("marquee");
    }
  }

  function updateCover(url) {
    const cover = document.getElementById("cover");
    const ambient = document.getElementById("ambient");
    const loader = new Image();

    cover.classList.add("updating");
    loader.onload = () => {
      cover.src = url;
      ambient.style.backgroundImage = `url("${url}")`;
      cover.classList.remove("updating");
    };
    loader.onerror = () => {
      cover.classList.remove("updating");
    };
    loader.src = url;
  }

  async function pollTuna() {
    try {
      const res = await fetch("http://localhost:1608/");
      const data = await res.json();
      const card = document.getElementById("widget");

      if (data.status !== "playing" || !data.title) {
        card.classList.add("hidden");
        return;
      }

      const artists = Array.isArray(data.artists)
        ? data.artists.join(", ")
        : (data.artists || "Яндекс Музыка");
      const trackKey = artists + " - " + data.title;

      if (trackKey !== lastTrack) {
        lastTrack = trackKey;
        document.getElementById("title").textContent = data.title;
        document.getElementById("artist").textContent = artists;
        updateTitleOverflow();
        updateCover("http://localhost:1608/cover.png?t=" + Date.now());
      }

      if (data.duration > 0) {
        const pct = Math.min(100, Math.max(0, (data.progress / data.duration) * 100));
        document.getElementById("progress").style.width = pct + "%";
      }

      card.classList.remove("hidden");
    } catch (e) {
      document.getElementById("widget").classList.add("hidden");
    }
  }

  setInterval(pollTuna, 1000);
  pollTuna();
</script>
</body>
</html>
