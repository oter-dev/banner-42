<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
    overflow: hidden;
  }

  /* Увеличенный скошенный корпус для высокого качества в OBS */
  .banner {
    width: 920px;
    height: 330px;
    position: relative;
    transform: skewX(-6deg);
    border-radius: 32px;
    background: linear-gradient(110deg, #070709 42%, #19070a 78%, #360b10 100%);
    border: 1.5px solid rgba(255, 255, 255, 0.14);
    box-shadow:
      0 26px 60px rgba(0, 0, 0, 0.7),
      inset 0 1.5px 0 rgba(255, 255, 255, 0.16),
      inset -60px 0 100px rgba(255, 42, 42, 0.13);
    overflow: hidden;
  }

  /* Красное свечение за QR-кодом */
  .banner::before {
    content: "";
    position: absolute;
    right: -45px;
    top: -60px;
    width: 450px;
    height: 450px;
    background: radial-gradient(circle, rgba(255, 46, 36, 0.34) 0%, rgba(255, 46, 36, 0) 70%);
    pointer-events: none;
  }

  /* Лёгкая зернистость фона */
  .noise {
    position: absolute;
    inset: 0;
    opacity: 0.045;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* Диагональный световой блик */
  .shine {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 56%;
    width: 165px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.03), transparent);
    pointer-events: none;
  }

  /* Компенсация наклона для ровного контента */
  .banner-inner {
    width: 100%;
    height: 100%;
    transform: skewX(6deg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 32px 54px 32px 58px;
    position: relative;
    z-index: 2;
  }

  /* Левая часть с текстом */
  .text-zone {
    flex: 1;
    padding-right: 36px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100%;
  }

  .top-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: #ffffff;
    background: rgba(255, 46, 36, 0.16);
    border: 1.5px solid rgba(255, 59, 48, 0.45);
    padding: 6px 14px;
    border-radius: 8px;
  }

  .live-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ff3b30;
    box-shadow: 0 0 12px #ff3b30;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.8); }
  }

  .stamp-tag {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.8);
    border: 1.5px dashed rgba(255, 255, 255, 0.3);
    padding: 6px 12px;
    border-radius: 6px;
  }

  .slide-container {
    position: relative;
    height: 156px;
  }

  .slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .slide.active {
    opacity: 1;
    transform: translateY(0);
  }

  .title {
    font-size: 44px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.06;
    letter-spacing: -0.8px;
    text-transform: uppercase;
    text-shadow: 0 3px 20px rgba(0, 0, 0, 0.55);
  }

  .title span {
    color: #ff3326;
    text-shadow: 0 0 30px rgba(255, 51, 38, 0.45);
  }

  .subtitle {
    font-size: 20px;
    color: #bdbdc7;
    margin-top: 12px;
    font-weight: 600;
    line-height: 1.32;
  }

  /* Индикатор слайдов */
  .progress-dots {
    display: flex;
    gap: 9px;
    margin-top: 16px;
  }

  .dot {
    width: 24px;
    height: 4px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.16);
    transition: all 0.35s ease;
  }

  .dot.active {
    width: 44px;
    background: #ff3326;
    box-shadow: 0 0 14px rgba(255, 51, 38, 0.65);
  }

  /* Правая часть с 3D-карточкой QR */
  .qr-wrapper {
    width: 232px;
    height: 232px;
    perspective: 1200px;
    flex-shrink: 0;
    position: relative;
  }

  .qr-glow {
    position: absolute;
    inset: -16px;
    border-radius: 34px;
    background: radial-gradient(circle, rgba(255, 51, 38, 0.3) 0%, transparent 72%);
    filter: blur(12px);
    pointer-events: none;
  }

  .qr-card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    animation: spinPause 7.5s cubic-bezier(0.45, 0.05, 0.2, 1) infinite;
  }

  .qr-face {
    position: absolute;
    inset: 0;
    border-radius: 24px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
  }

  .qr-front {
    background: #ffffff;
    padding: 13px;
    box-shadow:
      0 18px 40px rgba(0, 0, 0, 0.6),
      0 0 0 1.5px rgba(255, 255, 255, 0.25);
  }

  .qr-front img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 13px;
    display: block;
  }

  .corner {
    position: absolute;
    width: 18px;
    height: 18px;
    border: 3.5px solid #ff3326;
    pointer-events: none;
  }
  .corner.tl { top: 7px; left: 7px; border-right: 0; border-bottom: 0; border-top-left-radius: 9px; }
  .corner.tr { top: 7px; right: 7px; border-left: 0; border-bottom: 0; border-top-right-radius: 9px; }
  .corner.bl { bottom: 7px; left: 7px; border-right: 0; border-top: 0; border-bottom-left-radius: 9px; }
  .corner.br { bottom: 7px; right: 7px; border-left: 0; border-top: 0; border-bottom-right-radius: 9px; }

  .qr-back {
    transform: rotateY(180deg);
    background: linear-gradient(145deg, #16161a 0%, #2d090e 100%);
    border: 2px solid rgba(255, 51, 38, 0.55);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65);
  }

  .qr-back svg {
    width: 68px;
    height: 68px;
    fill: #ffffff;
    filter: drop-shadow(0 0 18px rgba(255, 51, 38, 0.55));
  }

  .qr-back span {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #ff3326;
    text-transform: uppercase;
  }

  @keyframes spinPause {
    0%, 58% {
      transform: rotateY(0deg);
    }
    86%, 100% {
      transform: rotateY(360deg);
    }
  }
</style>
</head>
<body>

<div class="banner">
  <div class="noise"></div>
  <div class="shine"></div>

  <div class="banner-inner">
    <div class="text-zone">
      <div class="top-row">
        <div class="badge"><span class="live-dot"></span>TG • НОВОСТНИК</div>
        <div class="stamp-tag">42 КМ</div>
      </div>

      <div class="slide-container">
        <div class="slide active">
          <div class="title">ПОДСЛУШАННО <span>42</span></div>
          <div class="subtitle">Самое НИШЕВОЕ СМИ в 42км</div>
        </div>
        <div class="slide">
          <div class="title">ГЛАВНЫЙ <span>НОВОСТНИК</span></div>
          <div class="subtitle">Инсайды, события и сводки без воды</div>
        </div>
        <div class="slide">
          <div class="title">СКАНИРУЙ <span>QR</span></div>
          <div class="subtitle">Подписывайся и будь в курсе 42км</div>
        </div>
      </div>

      <div class="progress-dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <div class="qr-wrapper">
      <div class="qr-glow"></div>
      <div class="qr-card">
        <div class="qr-face qr-front">
          <span class="corner tl"></span>
          <span class="corner tr"></span>
          <span class="corner bl"></span>
          <span class="corner br"></span>
          <img src="qr-code.jpg" alt="QR Code">
        </div>
        <div class="qr-face qr-back">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
          </svg>
          <span>СМИ • 42 КМ</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const slides = document.querySelectorAll('.slide');
  const dots = document.querySelectorAll('.dot');
  let current = 0;

  setInterval(() => {
    slides[current].classList.remove('active');
    dots[current].classList.remove('active');
    current = (current + 1) % slides.length;
    slides[current].classList.add('active');
    dots[current].classList.add('active');
  }, 3500);
</script>

</body>
</html>
