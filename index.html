<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,900&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
    overflow: hidden;
  }

  .banner {
    width: 1140px;
    height: 480px;
    position: relative;
  }

  .banner-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 24px 40px rgba(0, 0, 0, 0.8));
    pointer-events: none;
  }

  .banner-inner {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 44px;
    padding: 34px 48px 34px 54px;
    position: relative;
    z-index: 2;
  }

  /* Левая часть — максимально крупный и читаемый текст */
  .text-zone {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100%;
  }

  .top-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #ffffff;
    background: rgba(255, 77, 166, 0.2);
    border: 2.5px solid #ff5cb0;
    padding: 7px 18px;
    border-radius: 12px;
    white-space: nowrap;
  }

  .live-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #a3f048;
    box-shadow: 0 0 14px #a3f048;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.8); }
  }

  .news-tag {
    font-size: 20px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #c7fa7f;
    border: 2.5px dashed rgba(163, 240, 72, 0.6);
    padding: 7px 16px;
    border-radius: 10px;
    white-space: nowrap;
  }

  .slide-container {
    position: relative;
    height: 242px;
    width: 100%;
    overflow: hidden;
  }

  .slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .slide.active {
    opacity: 1;
    transform: none;
  }

  .title {
    font-size: 62px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.02;
    letter-spacing: -1.2px;
    text-transform: uppercase;
    text-shadow: 0 5px 22px rgba(0, 0, 0, 0.7);
  }

  .title span {
    display: inline-block;
    color: #ff69b8;
    paint-order: stroke fill;
    -webkit-text-stroke: 7px #5f0738;
    text-shadow:
      0 5px 0 #420326,
      0 10px 26px rgba(255, 77, 166, 0.55);
  }

  .subtitle {
    font-size: 28px;
    color: #d9eee6;
    margin-top: 16px;
    font-weight: 700;
    line-height: 1.24;
  }

  .subtitle b {
    color: #b7f36b;
    font-weight: 900;
  }

  /* Толстые полосы прогресса — хорошо видны даже на маленьком баннере */
  .progress-dots {
    display: flex;
    gap: 12px;
    margin-top: 16px;
  }

  .dot {
    width: 44px;
    height: 8px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.16);
    overflow: hidden;
    position: relative;
    transition: width 0.35s ease;
  }

  .dot.active {
    width: 92px;
  }

  .dot.active::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, #ff5cb0, #a3f048);
    border-radius: 6px;
    transform-origin: left;
    animation: fillBar 3.5s linear forwards;
  }

  @keyframes fillBar {
    from { transform: scaleX(0); }
    to { transform: scaleX(1); }
  }

  /* Правая колонка: QR-код + текст «ПОДСЛУШАННО 42» под ним */
  .qr-column {
    width: 330px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }

  .qr-wrapper {
    width: 296px;
    height: 296px;
    perspective: 1400px;
    position: relative;
  }

  .qr-card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    animation: spinPause 7.5s cubic-bezier(0.45, 0.05, 0.2, 1) infinite;
  }

  .qr-face {
    position: absolute;
    inset: 0;
    border-radius: 30px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
  }

  .qr-front {
    background: #ffffff;
    padding: 16px;
    box-shadow:
      0 20px 42px rgba(4, 18, 14, 0.55),
      0 0 0 3px rgba(255, 255, 255, 0.92);
  }

  .qr-front img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 14px;
    display: block;
    image-rendering: -webkit-optimize-contrast;
  }

  .corner {
    position: absolute;
    width: 26px;
    height: 26px;
    border: 5px solid #ff4da6;
    pointer-events: none;
  }
  .corner.tl { top: 8px; left: 8px; border-right: 0; border-bottom: 0; border-top-left-radius: 11px; }
  .corner.tr { top: 8px; right: 8px; border-left: 0; border-bottom: 0; border-top-right-radius: 11px; }
  .corner.bl { bottom: 8px; left: 8px; border-right: 0; border-top: 0; border-bottom-left-radius: 11px; }
  .corner.br { bottom: 8px; right: 8px; border-left: 0; border-top: 0; border-bottom-right-radius: 11px; }

  .qr-back {
    transform: rotateY(180deg);
    background: linear-gradient(145deg, #07120f 0%, #142a25 100%);
    border: 3.5px solid #ff5cb0;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 20px 42px rgba(4, 18, 14, 0.65);
  }

  .qr-back svg {
    width: 116px;
    height: 116px;
    fill: #ff5cb0;
    stroke: #5f0738;
    stroke-width: 1.2px;
    filter: drop-shadow(0 0 22px rgba(255, 92, 176, 0.55));
  }

  /* Текст прямо под QR-кодом */
  .qr-brand {
    width: 100%;
    text-align: center;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: #ffffff;
    background: rgba(6, 14, 12, 0.88);
    border: 2.5px solid #ff5cb0;
    padding: 10px 14px;
    border-radius: 14px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
    white-space: nowrap;
  }

  .qr-brand span {
    color: #b7f36b;
  }

  @keyframes spinPause {
    0%, 58% {
      transform: rotateY(0deg);
    }
    86%, 100% {
      transform: rotateY(360deg);
    }
  }
</style>
</head>
<body>

<div class="banner">
  <!-- Новая форма: горизонтальная HUD-карточка со скошенными углами и диагональным разделением -->
  <svg class="banner-bg" viewBox="0 0 1140 480" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="darkLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#050908"/>
        <stop offset="100%" stop-color="#0b1a17"/>
      </linearGradient>

      <linearGradient id="slimeRightGrad" x1="20%" y1="0%" x2="80%" y2="100%">
        <stop offset="0%" stop-color="#b4e95f"/>
        <stop offset="52%" stop-color="#58ce85"/>
        <stop offset="100%" stop-color="#1b8e90"/>
      </linearGradient>

      <linearGradient id="hudBorder" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#a3f048"/>
        <stop offset="52%" stop-color="rgba(255,255,255,0.28)"/>
        <stop offset="100%" stop-color="#ff5cb0"/>
      </linearGradient>

      <linearGradient id="slashLine" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#a3f048"/>
        <stop offset="50%" stop-color="#ff5cb0"/>
        <stop offset="100%" stop-color="#ff85c8"/>
      </linearGradient>

      <!-- Скошенные углы (верхний левый и нижний правый срезаны) -->
      <clipPath id="hudClip">
        <path d="M 52,4 L 1110,4 Q 1136,4 1136,30 L 1136,428 L 1088,476 L 30,476 Q 4,476 4,450 L 4,52 Z"/>
      </clipPath>

      <clipPath id="rightSlimeClip">
        <polygon points="755,0 1140,0 1140,480 715,480"/>
      </clipPath>
    </defs>

    <g clip-path="url(#hudClip)">
      <!-- Тёмный фон под крупный текст -->
      <rect x="0" y="0" width="1140" height="480" fill="url(#darkLeftGrad)"/>
      <circle cx="140" cy="400" r="220" fill="rgba(255, 77, 166, 0.08)"/>
      <circle cx="520" cy="60" r="190" fill="rgba(163, 240, 72, 0.06)"/>

      <!-- Правая витрина в цветах логотипа -->
      <g clip-path="url(#rightSlimeClip)">
        <rect x="700" y="0" width="440" height="480" fill="url(#slimeRightGrad)"/>
        <g fill="rgba(255, 255, 255, 0.17)">
          <path d="M800,30 C860,0 930,35 908,95 C886,155 810,145 782,102 C754,59 768,48 800,30 Z"/>
          <path d="M1010,75 C1080,45 1135,95 1110,165 C1085,235 995,215 978,158 C961,101 972,92 1010,75 Z"/>
          <path d="M775,345 C840,315 905,365 880,430 C855,495 755,480 742,418 C729,356 742,362 775,345 Z"/>
        </g>
        <g fill="rgba(12, 92, 86, 0.14)">
          <path d="M1020,310 C1085,280 1140,335 1115,400 C1090,465 995,445 982,385 C969,325 985,328 1020,310 Z"/>
        </g>
      </g>

      <!-- Диагональный неоновый разделитель -->
      <line x1="755" y1="0" x2="715" y2="480" stroke="url(#slashLine)" stroke-width="6"/>
    </g>

    <!-- Внешняя неоновая рамка -->
    <path d="M 52,4 L 1110,4 Q 1136,4 1136,30 L 1136,428 L 1088,476 L 30,476 Q 4,476 4,450 L 4,52 Z"
          fill="none" stroke="url(#hudBorder)" stroke-width="3.5"/>
  </svg>

  <div class="banner-inner">
    <div class="text-zone">
      <div class="top-row">
        <div class="badge"><span class="live-dot"></span>TG • НОВОСТНИК</div>
        <div class="news-tag">NEWS • 42 КМ</div>
      </div>

      <div class="slide-container">
        <div class="slide active">
          <div class="title">НИШЕВОЕ<br><span>СМИ 42 КМ</span></div>
          <div class="subtitle">Самое главное <b>без лишней воды</b></div>
        </div>
        <div class="slide">
          <div class="title">ГЛАВНЫЙ<br><span>НОВОСТНИК</span></div>
          <div class="subtitle">Свежие инсайды и сводки <b>24/7</b></div>
        </div>
        <div class="slide">
          <div class="title">СКАНИРУЙ<br><span>QR-КОД</span></div>
          <div class="subtitle">Залетай в ленту и будь <b>в курсе</b></div>
        </div>
      </div>

      <div class="progress-dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <div class="qr-column">
      <div class="qr-wrapper">
        <div class="qr-card">
          <div class="qr-face qr-front">
            <span class="corner tl"></span>
            <span class="corner tr"></span>
            <span class="corner bl"></span>
            <span class="corner br"></span>
            <img src="qr-code.jpg" alt="">
          </div>
          <div class="qr-face qr-back">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
            </svg>
          </div>
        </div>
      </div>
      <div class="qr-brand">ПОДСЛУШАННО <span>42</span></div>
    </div>
  </div>
</div>

<script>
  const slides = document.querySelectorAll('.slide');
  const dots = document.querySelectorAll('.dot');
  let current = 0;

  setInterval(() => {
    slides[current].classList.remove('active');
    dots[current].classList.remove('active');
    current = (current + 1) % slides.length;
    slides[current].classList.add('active');
    dots[current].classList.add('active');
  }, 3500);
</script>

</body>
</html>
