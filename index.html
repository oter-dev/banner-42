<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
    overflow: hidden;
  }

  /* Контейнер без transform: skewX — текст и QR рендерятся попиксельно резко */
  .banner {
    width: 1200px;
    height: 430px;
    position: relative;
  }

  /* Векторный скошенный фон + тень только на подложке */
  .banner-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 24px 38px rgba(0, 0, 0, 0.72));
    pointer-events: none;
  }

  .banner-inner {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 40px 84px 40px 92px;
    position: relative;
    z-index: 2;
  }

  /* Левая часть с текстом */
  .text-zone {
    flex: 1;
    padding-right: 48px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100%;
  }

  .top-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ffffff;
    background: rgba(255, 46, 36, 0.16);
    border: 2px solid rgba(255, 59, 48, 0.5);
    padding: 8px 18px;
    border-radius: 10px;
  }

  .live-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #ff3b30;
    box-shadow: 0 0 14px #ff3b30;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.8); }
  }

  .stamp-tag {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.85);
    border: 2px dashed rgba(255, 255, 255, 0.32);
    padding: 8px 16px;
    border-radius: 8px;
  }

  .slide-container {
    position: relative;
    height: 192px;
  }

  .slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .slide.active {
    opacity: 1;
    transform: none;
  }

  .title {
    font-size: 56px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.06;
    letter-spacing: -1px;
    text-transform: uppercase;
    text-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
  }

  .title span {
    color: #ff3326;
    text-shadow: 0 0 36px rgba(255, 51, 38, 0.48);
  }

  .subtitle {
    font-size: 25px;
    color: #c4c4ce;
    margin-top: 14px;
    font-weight: 600;
    line-height: 1.32;
  }

  /* Индикатор слайдов */
  .progress-dots {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }

  .dot {
    width: 32px;
    height: 5px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.18);
    transition: all 0.35s ease;
  }

  .dot.active {
    width: 58px;
    background: #ff3326;
    box-shadow: 0 0 16px rgba(255, 51, 38, 0.7);
  }

  /* Правая часть с 3D-карточкой QR */
  .qr-wrapper {
    width: 300px;
    height: 300px;
    perspective: 1400px;
    flex-shrink: 0;
    position: relative;
  }

  .qr-glow {
    position: absolute;
    inset: -22px;
    border-radius: 42px;
    background: radial-gradient(circle, rgba(255, 51, 38, 0.32) 0%, transparent 72%);
    filter: blur(16px);
    pointer-events: none;
  }

  .qr-card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    animation: spinPause 7.5s cubic-bezier(0.45, 0.05, 0.2, 1) infinite;
  }

  .qr-face {
    position: absolute;
    inset: 0;
    border-radius: 30px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
  }

  .qr-front {
    background: #ffffff;
    padding: 17px;
    box-shadow:
      0 22px 48px rgba(0, 0, 0, 0.62),
      0 0 0 2px rgba(255, 255, 255, 0.28);
  }

  .qr-front img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 16px;
    display: block;
    image-rendering: -webkit-optimize-contrast;
  }

  .corner {
    position: absolute;
    width: 24px;
    height: 24px;
    border: 4.5px solid #ff3326;
    pointer-events: none;
  }
  .corner.tl { top: 9px; left: 9px; border-right: 0; border-bottom: 0; border-top-left-radius: 11px; }
  .corner.tr { top: 9px; right: 9px; border-left: 0; border-bottom: 0; border-top-right-radius: 11px; }
  .corner.bl { bottom: 9px; left: 9px; border-right: 0; border-top: 0; border-bottom-left-radius: 11px; }
  .corner.br { bottom: 9px; right: 9px; border-left: 0; border-top: 0; border-bottom-right-radius: 11px; }

  .qr-back {
    transform: rotateY(180deg);
    background: linear-gradient(145deg, #16161a 0%, #30090f 100%);
    border: 2.5px solid rgba(255, 51, 38, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    box-shadow: 0 22px 48px rgba(0, 0, 0, 0.68);
  }

  .qr-back svg {
    width: 88px;
    height: 88px;
    fill: #ffffff;
    filter: drop-shadow(0 0 22px rgba(255, 51, 38, 0.55));
  }

  .qr-back span {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 2.5px;
    color: #ff3326;
    text-transform: uppercase;
  }

  @keyframes spinPause {
    0%, 58% {
      transform: rotateY(0deg);
    }
    86%, 100% {
      transform: rotateY(360deg);
    }
  }
</style>
</head>
<body>

<div class="banner">
  <!-- Чёткая векторная скошенная карточка -->
  <svg class="banner-bg" viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="30%" x2="100%" y2="75%">
        <stop offset="0%" stop-color="#060608"/>
        <stop offset="46%" stop-color="#0b090b"/>
        <stop offset="78%" stop-color="#1d070b"/>
        <stop offset="100%" stop-color="#3c0b12"/>
      </linearGradient>

      <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
        <stop offset="60%" stop-color="rgba(255,255,255,0.10)"/>
        <stop offset="100%" stop-color="rgba(255,51,38,0.45)"/>
      </linearGradient>

      <radialGradient id="redGlow" cx="84%" cy="46%" r="44%">
        <stop offset="0%" stop-color="rgba(255,46,36,0.34)"/>
        <stop offset="100%" stop-color="rgba(255,46,36,0)"/>
      </radialGradient>

      <pattern id="halftone" width="12" height="12" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.035)"/>
      </pattern>

      <clipPath id="cardClip">
        <rect x="48" y="2" width="1150" height="426" rx="38" ry="38" transform="skewX(-6)"/>
      </clipPath>
    </defs>

    <g clip-path="url(#cardClip)">
      <rect x="0" y="0" width="1200" height="430" fill="url(#bgGrad)"/>
      <rect x="0" y="0" width="1200" height="430" fill="url(#halftone)"/>
      <rect x="0" y="0" width="1200" height="430" fill="url(#redGlow)"/>
      <!-- Диагональный блик -->
      <polygon points="620,0 780,0 710,430 550,430" fill="rgba(255,255,255,0.025)"/>
    </g>

    <rect x="48" y="2" width="1150" height="426" rx="38" ry="38"
          transform="skewX(-6)"
          fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>
  </svg>

  <div class="banner-inner">
    <div class="text-zone">
      <div class="top-row">
        <div class="badge"><span class="live-dot"></span>TG • НОВОСТНИК</div>
        <div class="stamp-tag">42 КМ</div>
      </div>

      <div class="slide-container">
        <div class="slide active">
          <div class="title">ПОДСЛУШАННО <span>42</span></div>
          <div class="subtitle">Самое НИШЕВОЕ СМИ в 42км</div>
        </div>
        <div class="slide">
          <div class="title">ГЛАВНЫЙ <span>НОВОСТНИК</span></div>
          <div class="subtitle">Инсайды, события и сводки без воды</div>
        </div>
        <div class="slide">
          <div class="title">СКАНИРУЙ <span>QR</span></div>
          <div class="subtitle">Подписывайся и будь в курсе 42км</div>
        </div>
      </div>

      <div class="progress-dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <div class="qr-wrapper">
      <div class="qr-glow"></div>
      <div class="qr-card">
        <div class="qr-face qr-front">
          <span class="corner tl"></span>
          <span class="corner tr"></span>
          <span class="corner bl"></span>
          <span class="corner br"></span>
          <img src="qr-code.jpg" alt="QR Code">
        </div>
        <div class="qr-face qr-back">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
          </svg>
          <span>СМИ • 42 КМ</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const slides = document.querySelectorAll('.slide');
  const dots = document.querySelectorAll('.dot');
  let current = 0;

  setInterval(() => {
    slides[current].classList.remove('active');
    dots[current].classList.remove('active');
    current = (current + 1) % slides.length;
    slides[current].classList.add('active');
    dots[current].classList.add('active');
  }, 3500);
</script>

</body>
</html>
