<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Twitch Chat Overlay - denmiten36</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --user-col-width: 175px;   /* Ширина колонки со значками и ником */
    --font-size: 16px;         /* Размер шрифта чата */
    --bg-alpha: 0.68;          /* Затемнение подложки чата (0 — полностью прозрачно) */
    --bottom-pad: 42px;        /* Нижний отступ от края, чтобы текст не упирался в низ */
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    background: transparent;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    position: relative;
  }

  /* Отдельный слой фона: плавно тает сверху, справа И снизу — никаких резких обрезок при подъёме в OBS */
  #chat-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(
      90deg,
      rgba(6, 7, 10, var(--bg-alpha)) 0%,
      rgba(6, 7, 10, calc(var(--bg-alpha) * 0.85)) 76%,
      rgba(6, 7, 10, 0) 100%
    );
    -webkit-mask-image: linear-gradient(
      to bottom,
      transparent 0%,
      black 10%,
      black 88%,
      transparent 100%
    );
    mask-image: linear-gradient(
      to bottom,
      transparent 0%,
      black 10%,
      black 88%,
      transparent 100%
    );
  }

  /* Контейнер сообщений: растворяются только старые сообщения сверху, а нижнее всегда на 100% чёткое */
  #chat-viewport {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 24px 22px var(--bottom-pad) 10px;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 9%, black 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, black 9%, black 100%);
  }

  #chat-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }

  .msg-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    padding-bottom: 2px;
    animation: msgIn 0.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }

  .msg-row.fade-out {
    opacity: 0;
    transform: translateY(-6px);
  }

  /* Левая колонка: значки + ник */
  .user-col {
    width: var(--user-col-width);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 5px;
    overflow: hidden;
    line-height: 1.35;
    min-height: 22px;
  }

  .badges {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
  }

  .badge-icon {
    width: 18px;
    height: 18px;
    border-radius: 3px;
    object-fit: contain;
    display: block;
    flex-shrink: 0;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.85));
  }

  .username {
    font-weight: 800;
    font-size: var(--font-size);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    text-shadow:
      0 1px 3px rgba(0, 0, 0, 0.95),
      0 0 8px rgba(0, 0, 0, 0.7);
  }

  /* Правая колонка: текст сообщения и смайлы */
  .msg-col {
    flex: 1;
    min-width: 0;
    color: #ffffff;
    font-weight: 700;
    font-size: var(--font-size);
    line-height: 1.38;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    text-shadow:
      0 1px 3px rgba(0, 0, 0, 0.95),
      0 0 8px rgba(0, 0, 0, 0.75);
  }

  .msg-row.action-msg .msg-col {
    font-style: italic;
    opacity: 0.92;
  }

  .emote {
    height: 26px;
    width: auto;
    vertical-align: middle;
    margin: -4px 2px;
    display: inline-block;
  }

  @keyframes msgIn {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
</head>
<body>

<div id="chat-bg"></div>
<div id="chat-viewport">
  <div id="chat-container"></div>
</div>

<script>
  const CHANNEL = "denmiten36";
  const MAX_MESSAGES = 35;
  const MESSAGE_LIFETIME_MS = 0; // 0 = сообщения не исчезают сами, а уходят вверх. Поставь 30000 для автоскрытия через 30 сек.

  const chatContainer = document.getElementById("chat-container");
  const thirdPartyEmotes = new Map();
  const twitchBadges = new Map();

  const FALLBACK_BADGES = {
    broadcaster: `<svg class="badge-icon" viewBox="0 0 18 18"><rect width="18" height="18" rx="3" fill="#e91916"/><path fill="#fff" d="M3.5 5.5h7a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1zm8.5 2.2 3-2v6.6l-3-2V7.7z"/></svg>`,
    moderator: `<svg class="badge-icon" viewBox="0 0 18 18"><rect width="18" height="18" rx="3" fill="#00ad03"/><path fill="#fff" d="M14.2 3.8 11.4 4l-4.9 4.9-1.3-1.3-1.1 1.1 1.8 1.8-2.1 2.1 1.4 1.4 2.1-2.1 1.8 1.8 1.1-1.1-1.3-1.3 4.9-4.9.2-2.6z"/></svg>`,
    lead_moderator: `<svg class="badge-icon" viewBox="0 0 18 18"><rect width="18" height="18" rx="3" fill="#00ad03"/><path fill="#ffe14d" d="M14.2 3.8 11.4 4l-4.9 4.9-1.3-1.3-1.1 1.1 1.8 1.8-2.1 2.1 1.4 1.4 2.1-2.1 1.8 1.8 1.1-1.1-1.3-1.3 4.9-4.9.2-2.6z"/></svg>`,
    vip: `<svg class="badge-icon" viewBox="0 0 18 18"><rect width="18" height="18" rx="3" fill="#e005b9"/><path fill="#fff" d="M5.2 4.5h7.6l2.4 3.4L9 14.5 2.8 7.9l2.4-3.4z"/></svg>`,
    subscriber: `<svg class="badge-icon" viewBox="0 0 18 18"><rect width="18" height="18" rx="3" fill="#9146ff"/><path fill="#fff" d="M9 3.2 10.7 6.8l3.9.5-2.8 2.8.7 3.9L9 12.1 5.5 14l.7-3.9-2.8-2.8 3.9-.5L9 3.2z"/></svg>`,
    founder: `<svg class="badge-icon" viewBox="0 0 18 18"><rect width="18" height="18" rx="3" fill="#772ce8"/><path fill="#ffd147" d="M3 12.8 4.2 6l3 2.7L9 4.8l1.8 3.9 3-2.7 1.2 6.8H3z"/></svg>`,
    premium: `<svg class="badge-icon" viewBox="0 0 18 18"><rect width="18" height="18" rx="3" fill="#0096d6"/><path fill="#fff" d="M3 12.5 4.2 6l3 2.7L9 5l1.8 3.7 3-2.7 1.2 6.5H3z"/></svg>`,
    turbo: `<svg class="badge-icon" viewBox="0 0 18 18"><rect width="18" height="18" rx="3" fill="#6441a5"/><path fill="#fff" d="M9.8 3.2 4.8 10h3.6l-.8 4.8 5.6-6.8H9.5l.3-4.8z"/></svg>`,
    partner: `<svg class="badge-icon" viewBox="0 0 18 18"><rect width="18" height="18" rx="3" fill="#9146ff"/><path fill="#fff" d="m7.6 12.8-3.2-3.2 1.3-1.3 1.9 1.9 4.7-4.7 1.3 1.3-6 6z"/></svg>`,
    "artist-badge": `<svg class="badge-icon" viewBox="0 0 18 18"><rect width="18" height="18" rx="3" fill="#1e69ff"/><path fill="#fff" d="M13.6 3.6a1.5 1.5 0 0 1 0 2.1l-6.2 6.2-2.6.7.7-2.6 6.2-6.2a1.5 1.5 0 0 1 1.9-.2z"/></svg>`,
    "bot-badge": `<svg class="badge-icon" viewBox="0 0 18 18"><rect width="18" height="18" rx="3" fill="#53535f"/><path fill="#fff" d="M5 6.5h8a1.5 1.5 0 0 1 1.5 1.5v4A1.5 1.5 0 0 1 13 13.5H5A1.5 1.5 0 0 1 3.5 12V8A1.5 1.5 0 0 1 5 6.5zm2 2.2a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm4 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/></svg>`
  };

  async function loadTwitchBadges() {
    const endpoints = [
      "https://api.ivr.fi/v2/twitch/badges/global",
      `https://api.ivr.fi/v2/twitch/badges/channel?login=${encodeURIComponent(CHANNEL)}`
    ];

    for (const url of endpoints) {
      try {
        const res = await fetch(url);
        if (!res.ok) continue;
        const sets = await res.json();
        if (!Array.isArray(sets)) continue;
        sets.forEach(set => {
          if (set.versions && Array.isArray(set.versions)) {
            set.versions.forEach(ver => {
              const imgUrl = ver.image_url_2x || ver.image_url_4x || ver.image_url_1x;
              if (imgUrl) {
                twitchBadges.set(`${set.set_id}/${ver.id}`, imgUrl);
              }
            });
          }
        });
      } catch (e) {
        console.warn("Badges load warning:", e);
      }
    }
  }

  async function loadGlobalEmotes() {
    await Promise.allSettled([
      fetch("https://7tv.io/v3/emote-sets/global")
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          if (data?.emotes) {
            data.emotes.forEach(e => thirdPartyEmotes.set(e.name, `https://cdn.7tv.app/emote/${e.id}/2x.webp`));
          }
        }),
      fetch("https://api.betterttv.net/3/cached/emotes/global")
        .then(r => r.ok ? r.json() : null)
        .then(list => {
          if (Array.isArray(list)) {
            list.forEach(e => thirdPartyEmotes.set(e.code, `https://cdn.betterttv.net/emote/${e.id}/2x`));
          }
        }),
      fetch("https://api.frankerfacez.com/v1/set/global")
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          if (data?.sets) {
            Object.values(data.sets).forEach(set => {
              set.emoticons?.forEach(e => {
                const url = e.urls["2"] || e.urls["1"] || e.urls["4"];
                if (url) thirdPartyEmotes.set(e.name, url.startsWith("//") ? `https:${url}` : url);
              });
            });
          }
        })
    ]);
  }

  async function loadChannelEmotes(roomId) {
    if (!roomId) return;
    await Promise.allSettled([
      fetch(`https://7tv.io/v3/users/twitch/${roomId}`)
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          if (data?.emote_set?.emotes) {
            data.emote_set.emotes.forEach(e => thirdPartyEmotes.set(e.name, `https://cdn.7tv.app/emote/${e.id}/2x.webp`));
          }
        }),
      fetch(`https://api.betterttv.net/3/cached/users/twitch/${roomId}`)
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          const all = [...(data?.channelEmotes || []), ...(data?.sharedEmotes || [])];
          all.forEach(e => thirdPartyEmotes.set(e.code, `https://cdn.betterttv.net/emote/${e.id}/2x`));
        }),
      fetch(`https://api.frankerfacez.com/v1/room/id/${roomId}`)
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          if (data?.sets) {
            Object.values(data.sets).forEach(set => {
              set.emoticons?.forEach(e => {
                const url = e.urls["2"] || e.urls["1"] || e.urls["4"];
                if (url) thirdPartyEmotes.set(e.name, url.startsWith("//") ? `https:${url}` : url);
              });
            });
          }
        })
    ]);
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function ensureReadableColor(hex) {
    if (!hex || !/^#[0-9a-f]{6}$/i.test(hex)) return "#ff7eb6";
    let r = parseInt(hex.slice(1, 3), 16);
    let g = parseInt(hex.slice(3, 5), 16);
    let b = parseInt(hex.slice(5, 7), 16);
    const lum = (0.299 * r + 0.587 * g + 0.114 * b);
    if (lum < 95) {
      const boost = Math.min(2.6, 110 / Math.max(lum, 18));
      r = Math.min(255, Math.round(r * boost + 30));
      g = Math.min(255, Math.round(g * boost + 30));
      b = Math.min(255, Math.round(b * boost + 30));
      return `rgb(${r}, ${g}, ${b})`;
    }
    return hex;
  }

  function parseTags(tagString) {
    const tags = {};
    if (!tagString) return tags;
    tagString.split(";").forEach(part => {
      const eqIdx = part.indexOf("=");
      if (eqIdx !== -1) {
        tags[part.slice(0, eqIdx)] = part.slice(eqIdx + 1);
      }
    });
    return tags;
  }

  function formatMessageWithEmotes(text, emotesTag) {
    const twitchReplacements = [];

    if (emotesTag) {
      emotesTag.split("/").forEach(emoteGroup => {
        const [emoteId, positions] = emoteGroup.split(":");
        if (!positions) return;
        positions.split(",").forEach(range => {
          const [start, end] = range.split("-").map(Number);
          twitchReplacements.push({
            start,
            end,
            url: `https://static-cdn.jtvnw.net/emoticons/v2/${emoteId}/default/dark/2.0`
          });
        });
      });
    }

    twitchReplacements.sort((a, b) => a.start - b.start);

    const chars = Array.from(text);
    let resultHtml = "";
    let cursor = 0;

    for (const rep of twitchReplacements) {
      if (rep.start >= cursor) {
        const plainChunk = chars.slice(cursor, rep.start).join("");
        resultHtml += replaceThirdPartyEmotes(plainChunk);
        resultHtml += `<img class="emote" src="${rep.url}" alt="">`;
        cursor = rep.end + 1;
      }
    }

    if (cursor < chars.length) {
      resultHtml += replaceThirdPartyEmotes(chars.slice(cursor).join(""));
    }

    return resultHtml;
  }

  function replaceThirdPartyEmotes(chunk) {
    return chunk.split(/(\s+)/).map(token => {
      if (thirdPartyEmotes.has(token)) {
        return `<img class="emote" src="${thirdPartyEmotes.get(token)}" alt="">`;
      }
      return escapeHtml(token);
    }).join("");
  }

  function buildBadgesHtml(badgesTag) {
    if (!badgesTag) return "";
    let html = "";
    badgesTag.split(",").forEach(entry => {
      const [setId, version] = entry.split("/");
      const exactKey = `${setId}/${version}`;
      if (twitchBadges.has(exactKey)) {
        html += `<img class="badge-icon" src="${twitchBadges.get(exactKey)}" alt="">`;
      } else if (FALLBACK_BADGES[setId]) {
        html += FALLBACK_BADGES[setId];
      }
    });
    return html;
  }

  function renderMessage(tags, messageText, isAction) {
    const row = document.createElement("div");
    row.className = isAction ? "msg-row action-msg" : "msg-row";
    if (tags.id) row.dataset.msgId = tags.id;
    if (tags["user-id"]) row.dataset.userId = tags["user-id"];

    const badgesHtml = buildBadgesHtml(tags.badges);
    const displayName = tags["display-name"] || "Viewer";
    const userColor = ensureReadableColor(tags.color);
    const formattedBody = formatMessageWithEmotes(messageText, tags.emotes);

    row.innerHTML = `
      <div class="user-col">
        ${badgesHtml ? `<span class="badges">${badgesHtml}</span>` : ""}
        <span class="username" style="color: ${escapeHtml(userColor)}">${escapeHtml(displayName)}</span>
      </div>
      <div class="msg-col">${formattedBody}</div>
    `;

    chatContainer.appendChild(row);

    while (chatContainer.children.length > MAX_MESSAGES) {
      chatContainer.removeChild(chatContainer.firstChild);
    }

    if (MESSAGE_LIFETIME_MS > 0) {
      setTimeout(() => {
        if (row.parentNode) {
          row.classList.add("fade-out");
          setTimeout(() => {
            if (row.parentNode) row.remove();
          }, 350);
        }
      }, MESSAGE_LIFETIME_MS);
    }
  }

  let channelEmotesLoaded = false;

  function connectTwitchChat() {
    const ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");

    ws.onopen = () => {
      ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
      ws.send("PASS SCHMOOPIIE");
      ws.send(`NICK justinfan${Math.floor(10000 + Math.random() * 89999)}`);
      ws.send(`JOIN #${CHANNEL.toLowerCase()}`);
    };

    ws.onmessage = (event) => {
      const lines = event.data.split("\r\n");
      for (const line of lines) {
        if (!line) continue;

        if (line.startsWith("PING")) {
          ws.send("PONG :tmi.twitch.tv");
          continue;
        }

        const tagPart = line.startsWith("@") ? line.slice(1, line.indexOf(" ")) : "";
        const rest = line.startsWith("@") ? line.slice(line.indexOf(" ") + 1) : line;
        const tags = parseTags(tagPart);

        if (rest.includes(" ROOMSTATE ")) {
          if (tags["room-id"] && !channelEmotesLoaded) {
            channelEmotesLoaded = true;
            loadChannelEmotes(tags["room-id"]);
          }
          continue;
        }

        if (rest.includes(" CLEARMSG ")) {
          const targetId = tags["target-msg-id"];
          if (targetId) {
            chatContainer.querySelectorAll(`[data-msg-id="${CSS.escape(targetId)}"]`).forEach(el => el.remove());
          }
          continue;
        }

        if (rest.includes(" CLEARCHAT ")) {
          const targetUserId = tags["target-user-id"];
          if (targetUserId) {
            chatContainer.querySelectorAll(`[data-user-id="${CSS.escape(targetUserId)}"]`).forEach(el => el.remove());
          } else {
            chatContainer.innerHTML = "";
          }
          continue;
        }

        if (rest.includes(" PRIVMSG ")) {
          const msgMatch = rest.match(/PRIVMSG #\S+ :(.*)$/);
          if (msgMatch) {
            let text = msgMatch[1];
            let isAction = false;
            if (text.startsWith("\u0001ACTION ") && text.endsWith("\u0001")) {
              text = text.slice(8, -1);
              isAction = true;
            }
            renderMessage(tags, text, isAction);
          }
        }
      }
    };

    ws.onclose = () => {
      setTimeout(connectTwitchChat, 3000);
    };
  }

  Promise.allSettled([loadTwitchBadges(), loadGlobalEmotes()]).then(() => {
    connectTwitchChat();
  });
</script>

</body>
</html>
